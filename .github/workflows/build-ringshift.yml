name: Build RingShift APK (stable signing)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build and sign RingShift APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ringshift

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK
        working-directory: ringshift
        run: gradle --no-daemon assembleDebug

      - name: Decode permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RINGSHIFT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing RINGSHIFT_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ringshift-release.jks"

      - name: Sign APK with permanent key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RINGSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing RINGSHIFT_KEYSTORE_PASSWORD repository secret" && exit 1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ringshift-release.jks" \
            --ks-key-alias ringshift \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out RingShift-v1.1.1.apk \
            ringshift/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose RingShift-v1.1.1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingShift-v1.1.1-APK
          path: RingShift-v1.1.1.apk
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: ringshift
          name: RingShift v1.1.1 (stable signing)
          body: |
            Stable-signed RingShift APK.
            This release uses the permanent RingShift release keystore. Keep that key safe for all future updates.
            IMPORTANT: The installed v1.0.0 / v1.1.0 app was signed with a different debug key. Back up its schedule settings, uninstall it, then install this release.
            Adds daily From → Until ranges, a return mode, AM/PM time selection, system bar insets, vector icon and subtle animations.
          files: RingShift-v1.1.1.apk
