name: Build RingShift APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ringshift-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out RingShift source
        uses: actions/checkout@v4
        with:
          ref: ringshift

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK
        working-directory: ringshift
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp ringshift/app/build/outputs/apk/debug/app-debug.apk RingShift-v1.1.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingShift-v1.1.0-APK
          path: RingShift-v1.1.0.apk
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: ringshift
          name: RingShift v1.1.0
          body: |
            RingShift Android debug APK.
            Adds daily From → Until ranges, a return mode, AM/PM time selection, system bar inset handling, a vector launcher icon, and subtle animations.
            Requires Android Notification Policy Access and Alarms & reminders access.
          files: RingShift-v1.1.0.apk
